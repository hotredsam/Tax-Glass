[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/io",
    "crates/cli",
    "crates/tui",
    "crates/perf-lab",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["GlassSheet contributors"]
repository = "https://github.com/hotredsam/tax-glass"

[workspace.dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
calamine = "0.26"
rust_xlsxwriter = "0.79"
ratatui = "0.28"
crossterm = "0.28"
glasssheet-engine = { path = "crates/engine" }
glasssheet-io = { path = "crates/io" }
